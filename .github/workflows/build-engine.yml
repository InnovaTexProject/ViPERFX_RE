name: build-engine
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64-v8a
        run: |
          cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static
          cmake --build build-arm64 -j
          find build-arm64 -name '*.so'
          cp $(find build-arm64 -name '*.so' | head -1) libinnovatex_audio_arm64.so
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded libinnovatex_audio_arm64.so

      - name: Build armeabi-v7a
        run: |
          cmake -S . -B build-arm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static
          cmake --build build-arm -j
          find build-arm -name '*.so'
          cp $(find build-arm -name '*.so' | head -1) libinnovatex_audio_arm.so
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded libinnovatex_audio_arm.so

      - uses: actions/upload-artifact@v4
        with:
          name: innovatex-binaries
          path: |
            libinnovatex_audio_arm64.so
            libinnovatex_audio_arm.so
